<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devoura Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #4f46e5;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            background-color: #6366f1;
            padding: 10px;
        }
        nav a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome, <span id="username">User</span></h1>
        <a href="/logout" style="color: #ffcd38;">Logout</a>
    </header>
    <nav>
        <a id="nav-employee" class="hidden" href="#">My Expenses</a>
        <a id="nav-manager" class="hidden" href="#">Team Approvals</a>
        <a id="nav-admin" class="hidden" href="#">Admin Panel</a>
    </nav>
    <main>
        <div id="employee-section" class="hidden">
            <h2>Employee Dashboard</h2>
            <p>Submit and view your expenses here.</p>
        </div>

        <div id="manager-section" class="hidden">
            <h2>Manager Dashboard</h2>
            <p>Approve or reject team expenses.</p>
        </div>

        <div id="admin-section" class="hidden">
            <h2>Admin Dashboard</h2>
            <p>Manage users and approval rules.</p>
        </div>
    </main>

    <script>
        // Fetch logged-in user info
        fetch('/user')
            .then(res => {
                if (!res.ok) {
                    window.location.href = '/'; // redirect to login if not logged in
                }
                return res.json();
            })
            .then(user => {
                document.getElementById('username').innerText = user.name;

                // Show sections based on role
                if(user.role === 'employee') {
                    document.getElementById('nav-employee').classList.remove('hidden');
                    document.getElementById('employee-section').classList.remove('hidden');
                }
                if(user.role === 'manager') {
                    document.getElementById('nav-manager').classList.remove('hidden');
                    document.getElementById('manager-section').classList.remove('hidden');
                }
                if(user.role === 'admin') {
                    document.getElementById('nav-admin').classList.remove('hidden');
                    document.getElementById('admin-section').classList.remove('hidden');
                }
            })
            .catch(err => {
                console.error(err);
                window.location.href = '/';
            });
    </script>
</body>
</html>
